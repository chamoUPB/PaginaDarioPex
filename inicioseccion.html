<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dario Pex – Organiza tus ideas creativas</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="Vista/styles.css">
<script type="module" src="Controlador/script.js"></script>


</head>
<body>

<!-- Navbar -->

    <nav class="navbar navbar-expand-md sticky-top bg-white bg-opacity-75 border-bottom" style="backdrop-filter:blur(8px)">
      <div class="container">
        <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="index.html"><span class="logo-mark"></span> Dario Pex</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu" aria-controls="menu" aria-expanded="false" aria-label="Abrir menú">
          <span class="navbar-toggler-icon"></span>
        </button>
            <a class="btn btn-brand" href="registro.html">Regístrate gratis</a>
          </div>
        </div>
      </div>
    </nav>

<main class="auth-page">
  <div class="form-container">
    <div class="brand-badge"><span class="logo-mark"></span></div>
    <p class="title">Inicia sesión</p>
    <p class="subtitle">Accede a tus tableros y sigue creando</p>

    <form class="form" id="login-form">
      <div class="field">
        <label for="username">Correo electrónico</label>
        <input type="email" name="username" id="username" placeholder="tu@correo.com" autocomplete="email" required>
      </div>
      <div class="field">
        <label for="password">Contraseña</label>
        <input type="password" name="password" id="password" placeholder="••••••••" autocomplete="current-password" required>
        <div class="forgot">
          <a rel="noopener noreferrer" href="#">¿Olvidaste tu contraseña?</a>
        </div>
      </div>
      <button type="submit" class="sign">Entrar</button>
      <p id="mensaje"></p>
    </form>

    <div class="social-message">
      <div class="line"></div>
      <p class="message">o continúa con</p>
      <div class="line"></div>
    </div>

    <div class="social-icons">
      <button type="button" aria-label="Continuar con Google" class="icon">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
          <path d="M16.318 13.714v5.484h9.078c-0.37 2.354-2.745 6.901-9.078 6.901-5.458 0-9.917-4.521-9.917-10.099s4.458-10.099 9.917-10.099c3.109 0 5.193 1.318 6.38 2.464l4.339-4.182c-2.786-2.599-6.396-4.182-10.719-4.182-8.844 0-16 7.151-16 16s7.156 16 16 16c9.234 0 15.365-6.49 15.365-15.635 0-1.052-0.115-1.854-0.255-2.651z"></path>
        </svg>
      </button>
    </div>

    <p class="signup">¿No tienes cuenta? <a rel="noopener noreferrer" href="registro.html">Regístrate</a></p>
  </div>
</main>
<br><br><br>
<!-- Footer -->
<footer class="border-top py-4 text-secondary small">
  <div class="container d-flex flex-wrap justify-content-between gap-3">
    <div><strong class="text-dark">Dario Pex</strong><br>© 2026 Todos los derechos reservados.</div>
  </div>
</footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
