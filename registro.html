<body>

<!-- Navbar -->

    <nav class="navbar navbar-expand-md sticky-top bg-white bg-opacity-75 border-bottom" style="backdrop-filter:blur(8px)">
      <div class="container">
        <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="index.html"><span class="logo-mark"></span> Dario Pex</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu" aria-controls="menu" aria-expanded="false" aria-label="Abrir menú">

        </button>
        <div class="collapse navbar-collapse" id="menu">
          <ul class="navbar-nav mx-auto mb-2 mb-md-0">
            <li class="nav-item"><a ></a></li>
            <li class="nav-item"><a ></a></li>

          </ul>
          <div class="d-flex gap-2">
            <a class="btn btn-outline-secondary" href="inicioseccion.html">Iniciar sesión</a>
          </div>
        </div>
      </div>
    </nav>

<main class="auth-page">
  <div class="form-container">
  <div class="brand-badge"><span class="logo-mark"></span></div>
  <p class="title">Crea tu cuenta</p>
  <p class="subtitle">Empieza a organizar tus ideas en minutos</p>

  <form class="form" id="registro-form" novalidate>
    <div class="field">
      <label for="email">Correo electrónico</label>
      <input type="email" name="email" id="email" placeholder="tu@correo.com" autocomplete="email" required>
    </div>

    <div class="field">
      <label for="usuario">Nombre de usuario</label>
      <input type="text" name="usuario" id="usuario" placeholder="tu_usuario" autocomplete="username"
             minlength="3" maxlength="20" pattern="[A-Za-z0-9_]+" required>
    </div>

    <div class="field">
      <label for="password">Contraseña</label>
      <input type="password" name="password" id="password" placeholder="Mínimo 8 caracteres" autocomplete="new-password" minlength="8" required>
    </div>

    <div class="field">
      <label for="password2">Confirmar contraseña</label>
      <input type="password" name="password2" id="password2" placeholder="Repite la contraseña" autocomplete="new-password" minlength="8" required>
      <p class="field-error" id="password-error" hidden>Las contraseñas no coinciden.</p>
    </div>

    <button type="submit" class="sign">Crear cuenta</button>
  </form>

  <div class="social-message">
    <div class="line"></div>
    <p class="message">o regístrate con</p>
    <div class="line"></div>
  </div>

  <div class="social-icons">
    <!-- Deja aquí los mismos tres botones de Google, Twitter y GitHub del login -->
  </div>

  <p class="signup">¿Ya tienes cuenta? <a rel="noopener noreferrer" href="inicioseccion.html">Inicia sesión</a></p>
</div>

<script>
  const form = document.getElementById('registro-form');
  const pass = document.getElementById('password');
  const pass2 = document.getElementById('password2');
  const error = document.getElementById('password-error');

  function revisarCoincidencia() {
    const noCoinciden = pass2.value !== '' && pass.value !== pass2.value;
    error.hidden = !noCoinciden;
    pass2.setCustomValidity(noCoinciden ? 'Las contraseñas no coinciden' : '');
    return !noCoinciden;
  }

  pass.addEventListener('input', revisarCoincidencia);
  pass2.addEventListener('input', revisarCoincidencia);

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    if (!revisarCoincidencia() || !form.checkValidity()) {
      form.reportValidity();
      return;
    }
    // Aquí envías los datos a tu backend, por ejemplo:
    // fetch('/api/registro', { method: 'POST', body: new FormData(form) });
    alert('Formulario válido: conéctalo a tu backend.');
  });
</script>
