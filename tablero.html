<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tablero – Dario Pex</title>
<link rel="icon" href="data:,">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="Vista/tablero.css">
<script type="module" src="Controlador/tableroController.js"></script>
</head>
<body class="pagina-tablero">

<!-- ============ Barra superior ============ -->
<header class="barra-superior">
  <a href="contenido.html#tableros" class="btn btn-sm btn-outline-secondary" id="btn-volver">← Mis tableros</a>
  <input type="text" id="tablero-nombre" class="nombre-tablero" maxlength="200"
         placeholder="Nombre del tablero" aria-label="Nombre del tablero" value="Mi tablero">
  <span id="estado-guardado" class="estado-guardado" role="status" aria-live="polite">Todo guardado</span>
  <div class="d-flex gap-1" role="group" aria-label="Historial">
    <button type="button" id="btn-deshacer" class="btn btn-sm btn-outline-secondary" title="Deshacer (Ctrl+Z)" aria-label="Deshacer" disabled>↶</button>
    <button type="button" id="btn-rehacer" class="btn btn-sm btn-outline-secondary" title="Rehacer (Ctrl+Y)" aria-label="Rehacer" disabled>↷</button>
  </div>
  <div class="ms-auto d-flex align-items-center gap-2">
    <span class="text-secondary small d-none d-md-inline" id="nombre-usuario"></span>
    <button type="button" class="btn btn-sm btn-outline-secondary" id="btn-salir">Cerrar sesión</button>
  </div>
</header>

<div id="mensaje" class="mensaje-flotante" role="status" aria-live="polite"></div>

<!-- ============ Herramientas ============ -->
<aside class="barra-herramientas" role="toolbar" aria-label="Herramientas del tablero" aria-orientation="vertical">
  <button type="button" class="herramienta" data-herramienta="nota" title="Nota">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
    <span>Nota</span>
  </button>
  <button type="button" class="herramienta" data-herramienta="lista_tareas" title="Lista de tareas">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6l2 2 3-3M4 14l2 2 3-3M12 7h8M12 15h8"/></svg>
    <span>Tareas</span>
  </button>
  <button type="button" class="herramienta" data-herramienta="enlace" title="Enlace">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>
    <span>Enlace</span>
  </button>
  <button type="button" class="herramienta" data-herramienta="imagen" title="Imagen">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.5"/><path d="M21 16l-5-5-8 8"/></svg>
    <span>Imagen</span>
  </button>
  <button type="button" class="herramienta" data-herramienta="linea" title="Línea (une dos elementos)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 19L19 5M10 5h9v9"/></svg>
    <span>Línea</span>
  </button>
</aside>

<!-- ============ Lienzo ============ -->
<main class="visor" id="visor" tabindex="0" aria-label="Lienzo del tablero">
  <div class="lienzo" id="lienzo">

    <!-- Capa de flechas (conexiones) -->
    <svg class="capa-flechas" id="capa-flechas" aria-hidden="true">
      <defs>
        <marker id="punta-flecha" viewBox="0 0 10 10" refX="9" refY="5"
                markerWidth="8" markerHeight="8" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z" fill="#9aa0ab" stroke="none"/>
        </marker>
      </defs>
      <g id="grupo-flechas">
        <!-- EJEMPLO: el controlador reemplaza esto -->
        <path d="M300,130 C360,130 360,210 420,210" marker-end="url(#punta-flecha)"/>
      </g>
    </svg>

    <!-- Capa de elementos -->
    <div class="capa-elementos" id="capa-elementos">
      <!-- EJEMPLOS: el controlador los reemplaza con los elementos reales del tablero -->
      <article class="elemento nota" data-tipo="nota" data-color="amarillo" tabindex="0"
               style="left:80px; top:80px; width:220px">
        <div class="elemento-contenido" data-campo="texto" contenteditable="false"
             role="textbox" aria-multiline="true" aria-label="Texto de la nota">Ejemplo de nota. Haz doble clic para editarla.</div>
        <span class="redimensionar" aria-hidden="true"></span>
      </article>

      <article class="elemento lista" data-tipo="lista_tareas" data-color="gris" tabindex="0"
               style="left:420px; top:150px; width:240px">
        <h3 class="lista-titulo" data-campo="titulo" contenteditable="false">TAREA</h3>
        <ul class="tareas">
          <li class="tarea">
            <input type="checkbox" class="tarea-casilla" aria-label="Completada">
            <span class="tarea-texto" contenteditable="false">Primera tarea</span>
            <button type="button" class="tarea-borrar" aria-label="Eliminar tarea">×</button>
          </li>
          <li class="tarea">
            <input type="checkbox" class="tarea-casilla" aria-label="Completada" checked>
            <span class="tarea-texto" contenteditable="false">Tarea completada</span>
            <button type="button" class="tarea-borrar" aria-label="Eliminar tarea">×</button>
          </li>
        </ul>
        <form class="tarea-nueva">
          <input type="text" maxlength="500" placeholder="+ Añadir tarea" aria-label="Nueva tarea">
        </form>
        <span class="redimensionar" aria-hidden="true"></span>
      </article>

      <article class="elemento enlace" data-tipo="enlace" data-color="gris" tabindex="0"
               style="left:120px; top:300px; width:220px">
        <a class="enlace-vinculo" href="https://example.com" target="_blank" rel="noopener noreferrer">
          <span class="enlace-titulo" data-campo="titulo">Ejemplo de enlace</span>
          <span class="enlace-dominio">example.com</span>
        </a>
      </article>
    </div>
  </div>
</main>

<!-- Mensaje cuando el tablero está vacío -->
<div class="estado-vacio" id="estado-vacio" hidden>
  <p>Tu tablero está vacío.<br>Elige una herramienta de la izquierda y haz clic en el lienzo para empezar.</p>
</div>

<!-- ============ Barra flotante del elemento seleccionado ============ -->
<div class="barra-elemento" id="barra-elemento" hidden role="toolbar" aria-label="Opciones del elemento">
  <div class="colores" role="group" aria-label="Color del elemento">
    <button type="button" class="color" data-color="gris" aria-label="Gris" title="Gris"></button>
    <button type="button" class="color" data-color="amarillo" aria-label="Amarillo" title="Amarillo"></button>
    <button type="button" class="color" data-color="azul" aria-label="Azul" title="Azul"></button>
    <button type="button" class="color" data-color="verde" aria-label="Verde" title="Verde"></button>
    <button type="button" class="color" data-color="rosa" aria-label="Rosa" title="Rosa"></button>
    <button type="button" class="color" data-color="rojo" aria-label="Rojo" title="Rojo"></button>
  </div>
  <button type="button" class="btn btn-sm btn-outline-secondary" id="btn-al-frente">Al frente</button>
  <button type="button" class="btn btn-sm btn-outline-danger" id="btn-eliminar">Eliminar</button>
</div>

<!-- ============ Barra flotante de la flecha seleccionada ============ -->
<div class="barra-flecha" id="barra-flecha" hidden role="toolbar" aria-label="Opciones de la flecha">
  <input type="text" id="flecha-etiqueta" maxlength="100" placeholder="Etiqueta" aria-label="Etiqueta de la flecha">

  <select id="flecha-direccion" aria-label="Puntas de la flecha">
    <option value="destino">→ Hacia el destino</option>
    <option value="origen">← Hacia el origen</option>
    <option value="ambas">↔ Ambos extremos</option>
    <option value="ninguna">— Sin puntas</option>
  </select>

  <select id="flecha-estilo" aria-label="Estilo de la línea">
    <option value="solida">Continua</option>
    <option value="punteada">Punteada</option>
    <option value="discontinua">Discontinua</option>
  </select>

  <select id="flecha-curva" aria-label="Forma de la línea">
    <option value="curva">Curva</option>
    <option value="recta">Recta</option>
  </select>

  <select id="flecha-grosor" aria-label="Grosor">
    <option value="1">Fina</option>
    <option value="2">Normal</option>
    <option value="3">Gruesa</option>
    <option value="4">Muy gruesa</option>
    <option value="6">Extra</option>
  </select>

  <div class="swatches" id="flecha-colores" role="group" aria-label="Color de la flecha">
    <button type="button" class="swatch" data-hex="" style="background:#9aa0ab" aria-label="Gris" title="Gris"></button>
    <button type="button" class="swatch" data-hex="#ffffff" style="background:#ffffff" aria-label="Blanco" title="Blanco"></button>
    <button type="button" class="swatch" data-hex="#f2dc7b" style="background:#f2dc7b" aria-label="Amarillo" title="Amarillo"></button>
    <button type="button" class="swatch" data-hex="#5b8def" style="background:#5b8def" aria-label="Azul" title="Azul"></button>
    <button type="button" class="swatch" data-hex="#58b98a" style="background:#58b98a" aria-label="Verde" title="Verde"></button>
    <button type="button" class="swatch" data-hex="#e58bb0" style="background:#e58bb0" aria-label="Rosa" title="Rosa"></button>
    <button type="button" class="swatch" data-hex="#d9645b" style="background:#d9645b" aria-label="Rojo" title="Rojo"></button>
  </div>

  <button type="button" class="btn btn-sm btn-outline-danger" id="btn-flecha-eliminar">Eliminar</button>
</div>
<!-- ============ Zoom ============ -->
<div class="controles-zoom" role="group" aria-label="Zoom">
  <button type="button" class="zoom-boton" id="btn-zoom-menos" aria-label="Alejar">−</button>
  <button type="button" class="zoom-boton" id="btn-zoom-reset" aria-label="Restablecer zoom"><span id="zoom-valor">100%</span></button>
  <button type="button" class="zoom-boton" id="btn-zoom-mas" aria-label="Acercar">+</button>
</div>

<!-- ============ Ventana para enlaces e imágenes ============ -->
<!-- Los campos no llevan "required" aquí: el controlador lo activa según el tipo, porque un campo oculto con "required" bloquea el envío -->
<div class="modal fade" id="modal-recurso" tabindex="-1" aria-labelledby="modal-recurso-titulo" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <form id="form-recurso">
        <div class="modal-header">
          <h2 class="modal-title h5" id="modal-recurso-titulo">Añadir</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body">

          <div id="campos-enlace" hidden>
            <div class="mb-3">
              <label for="enlace-url" class="form-label">Dirección (URL)</label>
              <input type="url" class="form-control" id="enlace-url" placeholder="https://...">
            </div>
            <div class="mb-1">
              <label for="enlace-titulo" class="form-label">Título (opcional)</label>
              <input type="text" class="form-control" id="enlace-titulo" maxlength="200">
            </div>
          </div>

          <div id="campos-imagen" hidden>
            <div class="mb-3">
              <label for="imagen-archivo" class="form-label">Subir una imagen</label>
              <input type="file" class="form-control" id="imagen-archivo" accept="image/jpeg,image/png,image/webp">
              <div class="form-text">JPG, PNG o WebP, máximo 2 MB.</div>
            </div>
            <p class="text-secondary text-center small mb-3">o</p>
            <div class="mb-1">
              <label for="imagen-url" class="form-label">Dirección de una imagen (URL)</label>
              <input type="url" class="form-control" id="imagen-url" placeholder="https://...">
            </div>
          </div>

          <p id="mensaje-recurso" class="mt-3 mb-0 small" role="status" aria-live="polite"></p>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="submit" class="btn btn-primary">Añadir</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
